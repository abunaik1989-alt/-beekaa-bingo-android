name: Build Beekaa Bingo Android APK

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          ZIP="Beekaa-Bingo-Android-Monthly-License-Project.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Project ZIP not found in repository root."
            echo "Upload the project ZIP, then run this workflow again."
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          find extracted -name build.gradle -print
          PROJECT_DIR="$(find extracted -name settings.gradle -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beekaa-Bingo-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
