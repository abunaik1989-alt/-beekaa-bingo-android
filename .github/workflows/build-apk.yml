name: Build Beekaa Bingo Android APK

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          ZIP="Beekaa-Bingo-Android-Monthly-License-Project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Project ZIP not found in repository root."
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

          PROJECT_DIR="$(find extracted -name settings.gradle -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Update embedded license public key
        env:
          NEW_PUBLIC_KEY: 
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          project = pathlib.Path(os.environ["PROJECT_DIR"])
          key = os.environ["NEW_PUBLIC_KEY"].strip()

          files = list(project.rglob("MainActivity.java"))

          if not files:
              print("ERROR: MainActivity.java was not found.")
              sys.exit(1)

          target = files[0]
          source = target.read_text(encoding="utf-8")

          pattern = r'(PUBLIC_KEY_B64\s*=\s*")[^"]+(")'

          updated, count = re.subn(
              pattern,
              lambda match: match.group(1) + key + match.group(2),
              source,
              count=1
          )

          if count != 1:
              print("ERROR: Could not safely locate the PUBLIC_KEY_B64 declaration.")
              print("No APK will be built with an unverified key replacement.")
              sys.exit(1)

          target.write_text(updated, encoding="utf-8")

          print("Successfully updated the public key in:", target)
          PY

      - name: Create missing launcher icon
        run: |
          RES="$PROJECT_DIR/app/src/main/res"

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$D"
          done

          cat > "$RES/mipmap-mdpi/ic_launcher.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#167D5A"
                  android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M12,12h24v24h-24z"/>
          </vector>
          XML

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beekaa-Bingo-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
