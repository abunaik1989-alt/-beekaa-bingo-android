name: Build Beekaa Bingo Android APK

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          ZIP="Beekaa-Bingo-Android-Monthly-License-Project.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Project ZIP not found in repository root."
            echo "Upload the project ZIP, then run this workflow again."
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          find extracted -name build.gradle -print
          PROJECT_DIR="$(find extracted -name settings.gradle -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"  
          
      - name: Create missing launcher icon
        run: |
          RES="$PROJECT_DIR/app/src/main/res"
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$D" in
              mdpi) S=48 ;;
              hdpi) S=72 ;;
              xhdpi) S=96 ;;
              xxhdpi) S=144 ;;
              xxxhdpi) S=192 ;;
            esac

            mkdir -p "$RES/mipmap-$D"

            cat > "$RES/mipmap-$D/ic_launcher.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#167D5A"
                  android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M12,12h24v24h-24z"/>
          </vector>
          XML
          done

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beekaa-Bingo-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
